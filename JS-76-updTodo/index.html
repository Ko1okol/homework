<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo List</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <script defer src="./js/main.js"></script>
  </head>
  <body>
    <div class="todo container" data-js-todo>
      <h1 class="todo__title">Todo List</h1>
      <form class="todo__form" data-js-todo-new-task-form>
        <div class="todo__field field">
          <label class="field__label" for="new-task">New task title</label>
          <input
            class="field__input"
            id="new-task"
            type="text"
            placeholder=" "
            autocomplete="off"
            data-js-todo-new-task-input
          />
        </div>
        <button class="todo__button" type="submit">Add</button>
      </form>
      <form class="todo__form" data-js-todo-search-task-form>
        <div class="todo__field field">
          <label class="field__label" for="search-task">Search tasks</label>
          <input
            class="field__input"
            id="search-task"
            type="search"
            placeholder=" "
            autocomplete="off"
            data-js-todo-search-task-input
          />
        </div>
      </form>
      <div class="todo__count">
        <div class="todo__total-tasks">
          Total tasks: <span data-js-todo-total-tasks>0</span>
        </div>
        <button
          class="todo__button-delete-all"
          type="button"
          data-js-todo-delete-all-button
        >
          Delete All
        </button>
      </div>
      <ul class="todo__list" data-js-todo-list></ul>
      <div class="todo__empty-message" data-js-todo-empty-message>No tasks</div>
    </div>
  </body>
</html>
